name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  test_shards:
    name: Test shard (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - name: Validate test partition runner
        if: matrix.shard == 0
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py'
      - name: Run assigned tests with ordinary Cargo/libtest
        run: python3 .github/ci/test_shards.py run --shard '${{ matrix.shard }}' --os '${{ matrix.os }}' --directory ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.shard }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  test:
    # Preserve the existing required checks. A failed/cancelled/missing shard
    # must never become a successful or skipped aggregate.
    name: Test (${{ matrix.os }})
    if: always()
    needs: test_shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Require successful shard jobs
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: tests-${{ matrix.os }}-*
          path: ci-results
      - name: Require complete disjoint coverage and matching provenance
        run: python3 .github/ci/test_shards.py verify --os '${{ matrix.os }}' --source '${{ github.sha }}' --directory ci-results

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
