name: CI

# PRs run the Linux suite. Merged commits are not re-tested (the PR already
# ran the same checks), and macOS runs only on demand: Actions > CI > Run
# workflow, before a release.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.94.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  test_shards:
    name: Tests — ${{ matrix.os == 'ubuntu-latest' && 'Ubuntu' || 'macOS' }} — ${{ matrix.group.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # PRs use Linux; a manual run adds macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
        group:
          - {id: storage, name: 'Storage & recovery'}
          - {id: api, name: 'API & protocols'}
          - {id: search, name: 'Search & embeddings'}
          # Includes CLI/binary/integration targets, doctests and new modules.
          - {id: runtime, name: 'Runtime & lifecycle'}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Validate test partition runner
        if: matrix.group.id == 'runtime'
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py'
      - name: Run assigned tests with ordinary Cargo/libtest
        run: python3 .github/ci/test_shards.py run --group '${{ matrix.group.id }}' --os '${{ matrix.os }}' --directory ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.group.id }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  test:
    # Preserve the existing required checks. A failed/cancelled/missing shard
    # must never become a successful or skipped aggregate.
    name: Test (${{ matrix.os }})
    if: always()
    needs: test_shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs use Linux; a manual run adds macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful shard jobs
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: tests-${{ matrix.os }}-*
          path: ci-results
      - name: Require complete disjoint coverage and matching provenance
        run: python3 .github/ci/test_shards.py verify --os '${{ matrix.os }}' --source '${{ github.sha }}' --directory ci-results

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Default binary has the UI command
        run: |
          ./target/release/recalld --help > help.txt
          grep -Eq '^\s+ui\s' help.txt || { echo "default build is missing 'ui'"; exit 1; }

  default-build-unchanged:
    # The web UI is a default feature; the headless build (--no-default-features,
    # as the Docker image uses) must keep the base branch's headless dependencies.
    name: Headless build unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Compare the headless dependency tree with the base's
        run: |
          # Paths differ between the two checkouts; compare names, versions, features.
          # recalld's own version and features change with releases; compare its dependencies only.
          tree() { cargo tree --locked -e normal,build --prefix none --format '{p} {f}' "$@" | sed -E 's# \(/[^)]*\)##; s#^recalld v.*#recalld#' | sort -u; }
          tree --no-default-features > head.txt
          git worktree add ../base "$(git merge-base HEAD origin/${{ github.base_ref }})"
          # Before the UI existed, the base's default build was this headless build.
          (cd ../base && tree --no-default-features) > base.txt
          diff -u base.txt head.txt
